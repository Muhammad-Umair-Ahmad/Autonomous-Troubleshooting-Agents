[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "autonomous-network-research"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["requests==2.34.2", "pydantic==2.14.3", "PyYAML==6.0.3", "numpy", "scipy", "matplotlib"]
[project.scripts]
neta = "neta.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
